enterButton:
  action: enter
  backgroundStyle:
  - conditionKey: $returnKeyType
    conditionValue:
    - 0
    - 2
    - 3
    - 5
    - 6
    - 8
    - 11
    styleName: systemButtonBackgroundStyle
  - conditionKey: $returnKeyType
    conditionValue:
    - 1
    - 4
    - 7
    - 9
    - 10
    styleName: blueButtonBackgroundStyle
  foregroundStyle:
  - conditionKey: $returnKeyType
    conditionValue:
    - 0
    - 2
    - 3
    - 5
    - 6
    - 8
    - 11
    styleName: enterButtonForegroundStyle
  - conditionKey: $returnKeyType
    conditionValue:
    - 1
    - 4
    - 7
    - 9
    - 10
    styleName: blueButtonForegroundStyle
  notification:
  - returnKeyTypeChangedNotification
  - preeditChangedForEnterButtonNotification
  swipeUpAction:
    symbol: "\r\n"
  size:
    width:
      percentage: 0.17

